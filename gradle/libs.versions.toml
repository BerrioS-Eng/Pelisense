[versions]
agp = "9.3.3"
coreKtx = "1.19.0"
credentials = "1.6.0"
firebaseBom = "35.0.0"
googleid = "1.2.1"
hiltAndroid = "2.60.1"
hiltAndroidCompiler = "2.60.1"
hiltNavigationCompose = "1.4.0"
junit = "4.13.2"
